allprojects {
    if (name == 'app') {
        tasks.register('renderCheckpointArtifacts', JavaExec) {
            dependsOn 'compileDebugUnitTestKotlin'
            classpath = tasks.named('testDebugUnitTest').get().classpath + files('/workspace/setup/checkpoint-tools')
            mainClass = 'ReviewCheckpointTools'
            args System.getProperty('checkpoint.mode', 'reviews')
            workingDir rootProject.projectDir
        }
    }
}
