// Bounded diagnostic: one6GiB worker for four neighboring unchanged classes.
allprojects {
    tasks.withType(Test).configureEach {
        def traceDir = System.getProperty('audit.refusal.trace')
        if (!traceDir || !traceDir.startsWith('/workspace/artifacts/unit3-startup-isolation-verified-2026-10-21/')) throw new GradleException('Explicit diagnostic trace path required')
        systemProperty 'audit.refusal.trace', traceDir
        jvmArgs '--add-exports=java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED', '--add-exports=java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED', '-javaagent:/workspace/artifacts/unit3-startup-isolation-verified-2026-10-21/trace-agent.jar=/workspace/artifacts/unit3-startup-isolation-verified-2026-10-21/trace-helper.jar'
        maxParallelForks = 1
        maxHeapSize = '6g'
        forkEvery = 4
        def gcDir = System.getProperty('audit.gc.dir')
        if (!gcDir || !gcDir.startsWith('/workspace/')) throw new GradleException('Explicit audit.gc.dir required')
        jvmArgs "-Xlog:gc:file=${gcDir}/gc-%p.log:time,uptime,level,tags"
    }
}
