// Same12GiB aggregate test heap budget; fewer workers with room for historical packs.
allprojects {
    tasks.withType(Test).configureEach {
        systemProperty 'audit.history.output', System.getProperty('audit.history.output')
        maxParallelForks = 2
        maxHeapSize = '6g'
        forkEvery = 4
        def gcDir = System.getProperty('audit.gc.dir')
        if (!gcDir || !gcDir.startsWith('/workspace/')) throw new GradleException('Explicit audit.gc.dir required')
        jvmArgs "-Xlog:gc:file=${gcDir}/gc-%p.log:time,uptime,level,tags"
    }
}
