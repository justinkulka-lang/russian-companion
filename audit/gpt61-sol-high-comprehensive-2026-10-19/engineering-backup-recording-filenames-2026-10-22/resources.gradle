allprojects { tasks.withType(Test).configureEach { maxParallelForks = 1; maxHeapSize = '6g'; forkEvery = 4; def gcDir = System.getProperty('audit.gc.dir'); if (!gcDir || !gcDir.startsWith('/workspace/')) throw new GradleException('Explicit audit.gc.dir required'); jvmArgs "-Xlog:gc:file=${gcDir}/gc-%p.log:time,uptime,level,tags" } }
