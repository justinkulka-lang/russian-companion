name: Engineering verification

on:
  push:
    paths-ignore:
      - WORK_QUEUE.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Archive exact verification source
        run: |
          mkdir -p verification-evidence
          git archive --format=tar.gz HEAD > verification-evidence/source.tar.gz
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          archive = Path("verification-evidence/source.tar.gz")
          identity = {
              "schemaVersion": 1,
              "kind": "engineering-verification-source",
              "checkoutCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "runId": os.environ["GITHUB_RUN_ID"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "archiveBytes": archive.stat().st_size,
              "archiveSha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "publicRelease": "NOT_APPROVED",
          }
          Path("verification-evidence/source-identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          PY
      - name: Retain exact verification source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-verification-source
          if-no-files-found: error
          retention-days: 90
          path: verification-evidence/
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compile, lint, verify gate attachment, and run host tests
        run: |
          ./gradlew compileDebugSources lintDebug verifyReleaseGateAttachment testDebugUnitTest --continue --stacktrace
      - name: Retain test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-test-reports
          if-no-files-found: warn
          retention-days: 90
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*

  verify-windows:
    runs-on: windows-2025
    env:
      RC_TEST_TEMP: D:/rc-tmp
    steps:
      - name: Preserve committed source bytes
        run: git config --global core.autocrlf false
      - name: Enable native symbolic links for containment tests
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Select the installed Python executable
        run: |
          $pythonPath = python -c "import sys; print(sys.executable)"
          "RC_TEST_PYTHON=$pythonPath" >> $env:GITHUB_ENV
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compile, lint, verify gate attachment, and run full Windows host tests
        run: |
          git rev-parse HEAD
          ./gradlew.bat compileDebugSources lintDebug verifyReleaseGateAttachment testDebugUnitTest --continue --stacktrace
      - name: Retain Windows test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-test-reports-windows
          if-no-files-found: warn
          retention-days: 90
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
