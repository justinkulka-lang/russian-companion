name: Build

on:
  push:
  pull_request:

# Superseded pull_request runs are cancelled. Push runs, including main and
# release branches, keep cancel-in-progress false because the event is not
# pull_request. head_ref is only set on pull_request, so a branch push and the
# pull_request run it opens are different groups and do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Trigger-level paths-ignore is not used. This job's check name is
      # "assemble", branch protection is not readable from CI, and a skipped
      # workflow would leave a required check pending. Markdown and docs/**
      # are inputs to testDebugUnitTest, so those diffs still run Gradle.
      # Only an .ai/**-only diff skips Gradle, and the job still succeeds.
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit() {
            echo "run_gradle=$1" >> "$GITHUB_OUTPUT"
            echo "run_full=$2" >> "$GITHUB_OUTPUT"
            echo "run_gradle=$1 run_full=$2"
          }

          full() {
            echo "$1"
            emit true true
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$PR_HEAD" ]; then
              full "Pull request head SHA is missing; running full CI."
              exit 0
            fi
            if ! git cat-file -e "${PR_HEAD}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "pull/${PR_NUMBER}/head" || true
            fi
            if ! git cat-file -e "${PR_HEAD}^{commit}" 2>/dev/null; then
              full "Pull request head is not in the clone; running full CI."
              exit 0
            fi
            if [ -n "$BASE_SHA" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              if [ -n "$BASE_REF" ]; then
                git fetch --no-tags origin "$BASE_REF" || true
              fi
            fi
            if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              full "Pull request base is not in the clone; running full CI."
              exit 0
            fi
            if ! files="$(git -c core.quotepath=false diff --name-status --find-renames "${BASE_SHA}...${PR_HEAD}")"; then
              full "Could not diff the pull request; running full CI."
              exit 0
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              full "New branch or unknown push range; running full CI."
              exit 0
            fi
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              full "Push parent is not in the clone; running full CI."
              exit 0
            fi
            if ! files="$(git -c core.quotepath=false diff --name-status --find-renames "$BEFORE" "$HEAD_SHA")"; then
              full "Could not diff the push; running full CI."
              exit 0
            fi
          else
            full "Unrecognized event; running full CI."
            exit 0
          fi

          if [ -z "$files" ]; then
            full "Empty diff; running full CI."
            exit 0
          fi

          run_gradle=false
          run_full=false
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            paths="${line#*$'\t'}"
            old="${paths%%$'\t'*}"
            new="${paths#*$'\t'}"
            for path in "$old" "$new"; do
              case "$path" in
                *.md|docs/*|.ai/*)
                  case "$path" in
                    *.md|docs/*) run_gradle=true ;;
                  esac
                  ;;
                *)
                  run_gradle=true
                  run_full=true
                  ;;
              esac
            done
          done <<< "$files"

          echo "Changed paths:"
          printf '%s\n' "$files"
          emit "$run_gradle" "$run_full"
      - name: Set up JDK 21
        if: steps.scope.outputs.run_gradle == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # setup-gradle owns the Gradle User Home cache. Leave the setup-java
      # cache unset, and do not add a separate actions/cache Gradle entry.
      - name: Set up Gradle
        if: steps.scope.outputs.run_gradle == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Android SDK
        if: steps.scope.outputs.run_gradle == 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Install SDK packages
        if: steps.scope.outputs.run_gradle == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Assemble debug, lint, gate attachment, and unit tests
        if: steps.scope.outputs.run_gradle == 'true'
        env:
          RUN_FULL: ${{ steps.scope.outputs.run_full }}
        run: |
          set -euo pipefail
          if [ "$RUN_FULL" = "true" ]; then
            echo "Running assembleDebug, lintDebug, verifyReleaseGateAttachment, and testDebugUnitTest."
            ./gradlew assembleDebug lintDebug verifyReleaseGateAttachment testDebugUnitTest --stacktrace
          else
            echo "No source files changed. testDebugUnitTest still runs because unit tests read markdown and docs."
            ./gradlew testDebugUnitTest verifyReleaseGateAttachment --stacktrace
          fi
      - name: Record acceptance-candidate APK identity
        if: steps.scope.outputs.run_full == 'true'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file() or apk.stat().st_size == 0:
              raise SystemExit(f"missing debug APK {apk}")
          data = apk.read_bytes()
          identity = {
              "schemaVersion": 1,
              "kind": "physical-device-acceptance-candidate",
              "publicRelease": "NOT_APPROVED",
              "frozen": False,
              "gradleTask": "assembleDebug",
              "apkFileName": "app-debug.apk",
              "applicationId": "dev.russiancompanion",
              "versionName": "2.0.0-dev",
              "versionCode": 5,
              "sourceCommit": os.environ["GITHUB_SHA"],
              "sha256": hashlib.sha256(data).hexdigest(),
              "apkBytes": len(data),
              "runId": os.environ["GITHUB_RUN_ID"],
              "runUrl": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
              "artifactName": "acceptance-candidate-debug-apk",
          }
          Path("artifact-identity.json").write_text(
              json.dumps(identity, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(identity, indent=2))
          PY
      - name: Upload acceptance-candidate debug APK
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-candidate-debug-apk
          if-no-files-found: error
          retention-days: 90
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            artifact-identity.json
      - name: Record non-code skip
        if: steps.scope.outputs.run_gradle != 'true'
        run: echo "Only .ai/** changed. assemble succeeds without running Gradle."
